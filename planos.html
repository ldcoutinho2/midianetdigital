<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escolha o Plano - MidiaNetDigital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#080810;--s1:#111120;--s2:#181828;--ac:#e8ff47;--ac2:#7c5cfc;--text:#f0f0f8;--muted:#8888aa;--border:rgba(255,255,255,0.07)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overflow-x:hidden;min-height:100vh}
    body::before{content:"";position:fixed;inset:0;opacity:.03;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(110px)}
    .b1{width:500px;height:500px;background:var(--ac2);top:-150px;right:-100px;opacity:.13}
    .b2{width:400px;height:400px;background:var(--ac);bottom:-150px;left:-100px;opacity:.06}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 6%;background:rgba(8,8,16,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .logo{font-family:"Syne",sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:-.03em;color:var(--text);text-decoration:none}
    .logo em{color:var(--ac);font-style:normal}
    .nav-back{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.875rem;font-weight:500;text-decoration:none;padding:.5rem 1rem;border:1px solid var(--border);border-radius:100px;transition:color .2s,border-color .2s}
    .nav-back:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
    .page{position:relative;z-index:1;min-height:100vh;padding:7rem 6% 5rem;display:flex;flex-direction:column;align-items:center}
    .prog{display:flex;align-items:center;margin-bottom:3rem}
    .st{display:flex;align-items:center;gap:.45rem;font-size:.78rem;font-weight:600;color:var(--muted)}
    .st.on{color:var(--ac)}.st.dn{color:rgba(232,255,71,.5)}
    .sd{width:26px;height:26px;border-radius:50%;background:var(--s2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
    .st.on .sd{background:var(--ac);color:#080810;border-color:var(--ac)}
    .st.dn .sd{background:rgba(232,255,71,.12);border-color:rgba(232,255,71,.3);color:var(--ac)}
    .sl{width:36px;height:1px;background:var(--border);margin:0 .2rem}.sl.dn{background:rgba(232,255,71,.3)}
    .ph{text-align:center;max-width:620px;margin-bottom:3rem}
    .ph h1{font-family:"Syne",sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-bottom:.7rem}
    .ph p{color:var(--muted);font-size:1rem}
    #grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem;width:100%;max-width:1000px}
    .card{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:2rem 1.75rem;text-decoration:none;color:var(--text);transition:transform .25s,border-color .25s,box-shadow .25s;position:relative;overflow:hidden;display:block;cursor:pointer}
    .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac2),var(--ac));opacity:0;transition:opacity .25s}
    .card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.14);box-shadow:0 20px 40px rgba(0,0,0,.4)}
    .card:hover::before,.card.hot::before{opacity:1}
    .card.hot{border-color:rgba(232,255,71,.28);background:linear-gradient(135deg,rgba(232,255,71,.05),var(--s1))}
    .cbadge{position:absolute;top:1rem;right:1rem;background:var(--ac);color:#080810;font-size:.67rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:.22rem .6rem;border-radius:100px}
    .cname{font-family:"Syne",sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:.1rem}
    .cqtd{color:var(--muted);font-size:.85rem;margin-bottom:.75rem}
    .cpreco{font-family:"Syne",sans-serif;font-size:2.2rem;font-weight:800;color:var(--ac);line-height:1;margin-bottom:.2rem}
    .cper{color:var(--muted);font-size:.75rem;margin-bottom:1rem}
    .clist{list-style:none;display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.25rem}
    .clist li{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:.38rem}
    .clist li::before{content:"✓";color:var(--ac);font-weight:700;flex-shrink:0}
    .cbtn{display:block;width:100%;padding:.75rem;background:var(--s2);border:1px solid var(--border);border-radius:100px;text-align:center;font-weight:600;font-size:.9rem;color:var(--text);transition:background .2s,border-color .2s}
    .card.hot .cbtn{background:var(--ac);color:#080810;border-color:var(--ac)}
    .card:hover .cbtn{background:var(--ac);color:#080810;border-color:var(--ac)}
    footer{position:relative;z-index:1;margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.78rem;width:100%;max-width:1000px}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .a1{animation:up .6s ease both}.a2{animation:up .6s .1s ease both}.a3{animation:up .6s .2s ease both}
    @media(max-width:600px){.page{padding:6.5rem 5% 4rem}nav{padding:1rem 5%}#grid{grid-template-columns:1fr}.sl{width:18px}}
  </style>
</head>
<body>
