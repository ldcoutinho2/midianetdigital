    var params = new URLSearchParams(location.search);
var servico = params.get("servico") || sessionStorage.getItem("servico") || "seguidores-brasileiros";
sessionStorage.setItem("servico", servico);
var grid = document.getElementById("grid");

async function carregarPlanosDoPainel(){
  try{
    var resp=await fetch("https://midianetdigital.onrender.com/config/public?servico="+encodeURIComponent(servico),{cache:"no-store"});
    if(!resp.ok) throw new Error("config");
    var cfg=await resp.json();
    var itens=(cfg.servicos||[]).filter(function(x){return x.ativo!==false;}).sort(function(a,b){return Number(a.preco)-Number(b.preco);});
    if(!itens.length){grid.innerHTML="<p style='color:#8888aa;text-align:center'>Nenhum pacote disponível para este serviço.</p>";return;}
    var titulo=(itens[0].nome||servico);
    document.body.setAttribute("data-service",servico);
    document.getElementById("titulo").textContent=titulo;
    document.getElementById("sub").textContent=itens[0].descricao||"Escolha o pacote ideal para você.";
    function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
    grid.innerHTML="";
    itens.forEach(function(x){
      var card=document.createElement("a");
      card.className="card"+(x.destaque?" hot":"");
      card.href="#";
      var qtd=x.qtd||x.plano;
      var nomePlano=x.plano;
      var por=x.por||"";
      var desc=x.descricao||"";
      card.innerHTML=(x.destaque?'<span class="cbadge">🔥 Mais vendido</span>':'')+
        '<div class="pkg-icon">'+esc(x.icone||'👤')+'</div>'+
        '<div class="pkg-info">'+
          '<div class="pkg-name">'+esc(qtd)+'</div>'+
          '<div class="pkg-bonuses">'+
            (Number(x.bonusCurtidas||0)>0?'<span>♥ +'+Number(x.bonusCurtidas).toLocaleString("pt-BR")+' Curtidas</span>':'')+
            (Number(x.bonusVisualizacoes||0)>0?'<span>▶ +'+Number(x.bonusVisualizacoes).toLocaleString("pt-BR")+' Visualizações</span>':'')+
            ((Number(x.bonusCurtidas||0)<=0 && Number(x.bonusVisualizacoes||0)<=0)?'<span>'+esc(desc||"Entrega rápida e suporte via WhatsApp")+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="pkg-buy">'+
          '<div class="pkg-from">A partir de</div>'+
          '<div class="pkg-price">'+Number(x.preco||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+'</div>'+
          '<div class="cbtn">Ver pacote →</div>'+
        '</div>';      card.addEventListener("click",async function(e){
        e.preventDefault();
        var valor=Number(x.preco||0);
        sessionStorage.setItem("plano",String(x.plano));
        sessionStorage.setItem("planoLabel",(qtd+" - "+Number(x.preco||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})));
        sessionStorage.setItem("plano_nome_pixel",qtd+" - "+titulo);
        sessionStorage.setItem("valor_plano",String(valor));
        if(typeof fbq==="function") fbq("track","ViewContent",{content_name:qtd+" - "+titulo,content_category:"Plano",value:valor,currency:"BRL"});
        try{
          var rr=await fetch("https://midianetdigital.onrender.com/evento",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tipo:"plano",plano:qtd+" - "+titulo}),keepalive:true});
          await rr.json().catch(function(){});
        }catch(_){}
        window.location.href="checkout.html?plano="+encodeURIComponent(x.plano)+"&servico="+encodeURIComponent(servico)+"&pagamento=pix";
      });
      grid.appendChild(card);
    });
  }catch(err){
    console.warn("[CONFIG PAINEL] usando catálogo local",err);
    // O catálogo embutido antigo continua disponível somente como fallback.
  }
}
carregarPlanosDoPainel();</script>
